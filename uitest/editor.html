<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ui-drift editor</title>
  <style>
    body {
      margin: 0;
      padding: 12px;
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .toolbar button,
    .toolbar select {
      min-height: 36px;
      padding: 0 10px;
    }

    #editor {
      background: #fff;
      border: 1px dashed #cbd5e1;
      padding: 0;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-top: 8px;
      font-family: monospace;
    }

    .palette { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .pal, .pal-ext { padding: 10px 14px; background: #fff; border: 1px solid #94a3b8; border-radius: 6px; font-size: 13px; }
    .pal-ext { border-style: dashed; border-color: #2563eb; }
    .ext-info { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; color: #475569; }
    #dropLog { font-family: monospace; word-break: break-all; }

    /* 항목 옵션 패널: 선택한 항목의 locked / resizable 을 바로 적용한다 */
    .item-options { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 8px; padding: 8px 12px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    .item-options .name { font-weight: 600; min-width: 130px; }
    .item-options .name.none { color: #94a3b8; font-weight: 400; }
    .item-options label { display: inline-flex; align-items: center; gap: 4px; min-height: 28px; }
    .item-options .hint { color: #64748b; font-size: 12px; }

    #log {
      font-size: 12px;
      color: #475569;
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <h3>ui-drift Editor</h3>
  <div class="toolbar">
    <button id="add">추가</button>
    <button id="remove">선택 삭제</button>
    <button id="undo">undo</button>
    <button id="redo">redo</button>
    <button id="reset">초기화</button>
    <button id="save">저장</button>
    <button id="export">JSON 내보내기</button>
    <button id="import">JSON 불러오기</button>
    <select id="bp">
      <option value="">desktop</option>
      <option value="auto">auto (컨테이너 폭)</option>
      <option value="tablet">tablet</option>
      <option value="mobile">mobile</option>
    </select>
    <label><input type="checkbox" id="float"> float (드롭 위치 유지)</label>
    <label><input type="checkbox" id="grid" checked> 격자 표시</label>
    <label>높이(px) <input type="number" id="height" min="0" step="50" placeholder="auto" style="width: 80px"></label>
  </div>
  <!-- 항목 옵션: 에디터에서 항목을 선택한 뒤 체크하면 바로 적용된다 -->
  <div class="item-options" id="itemOptions">
    <span class="name none" id="optName">항목을 선택하세요</span>
    <label id="lblLocked"><input type="checkbox" id="optLocked" disabled> locked (위치 고정: 이동 금지 + 고정 장애물)</label>
    <label id="lblResizable"><input type="checkbox" id="optResizable" disabled checked> resizable (크기 조절 가능)</label>
    <label id="lblLockedResizable"><input type="checkbox" id="optLockedResizable"> lockedResizable (resizable 미지정 locked 의 기본 허용)</label>
    <span class="hint" id="optHint">두 옵션은 독립입니다. locked 만 체크하면 크기도 고정(기본), resizable 도 체크하면 위치만 고정되고 크기는 조절됩니다.</span>
  </div>
  <!-- 끌어서 추가: 이 요소들을 아래 에디터로 끌어다 놓는다 -->
  <div class="palette" id="palette">
    <div class="pal" data-w="3" data-h="2" data-title="Chart" data-content="New chart">+ Chart (3x2)</div>
    <div class="pal" data-w="4" data-h="3" data-title="Table" data-content="New table">+ Table (4x3)</div>
    <div class="pal" data-w="2" data-h="2">+ Small (2x2)</div>
    <!-- autoAdd:false: Drift 는 드롭 정보만 전달하고, 항목 추가는 호출자(외부 모델)가 처리한다 -->
    <div class="pal-ext" data-w="3" data-h="2" data-title="External" data-content="외부 모델이 추가">+ External (autoAdd:false)</div>
  </div>
  <div class="ext-info">
    <label><input type="checkbox" id="extAdd" checked> onDrop 에서 addItem() 호출 (끄면 드롭 정보만 기록)</label>
    <span id="dropLog">onDrop: -</span>
  </div>
  <div id="editor"></div>
  <div id="log"></div>
  <textarea id="json" aria-label="layout json"></textarea>

  <script type="module">
    import '/style/daracl.drift.scss';
    import { createDriftEditor } from '/src/index.ts';

    // 리사이즈 핸들: 기본은 모서리(se, sw) + 변 가운데(e, w, s) 모두. ?handles=se,e 처럼 쿼리로 골라 볼 수 있다 (빈 값이면 핸들 없음)
    const q = new URLSearchParams(location.search).get('handles');
    const resizeHandles = q === null ? ['se', 'sw', 'e', 'w', 's'] : q.split(',').filter(Boolean);

    const editor = createDriftEditor('#editor', {
      layout: {
        columns: 24,
        rowHeight: 30,
        items: [
          { id: 'a', x: 0, y: 0, w: 4, h: 3, content: 'Chart A', title: "test1" },
          { id: 'b', x: 4, y: 0, w: 4, h: 3, content: 'Chart B' },
          { id: 'c', x: 8, y: 0, w: 4, h: 3, content: 'Map' },
          { id: 'd', x: 0, y: 3, w: 8, h: 3, content: 'Table', props: { kind: 'table' } },
          { id: 'e', x: 8, y: 3, w: 4, h: 3, content: 'Notes' },
        ],
      },
      removable: true,
      resizeHandles,
      // 스크롤 영역 지정 예: ?scroll=.wrap (편집기 조상의 selector). 생략하면 스크롤 가능한 조상을 자동 탐색
      scrollContainer: new URLSearchParams(location.search).get('scroll') || undefined,
    });
    window.editor = editor;
    editor.setupDragIn('.pal');

    const log = document.getElementById('log');
    editor.on('layoutChange', (layout, info) => {
      log.textContent = `layoutChange: ${info.reason} (${layout.items.length} items)`;
    });

    // ── 항목 옵션 패널: 선택한 항목의 locked / resizable 을 체크박스로 바로 적용 ──
    const optName = document.getElementById('optName');
    const optLocked = document.getElementById('optLocked');
    const optResizable = document.getElementById('optResizable');
    const optLockedResizable = document.getElementById('optLockedResizable');

    function syncOptions() {
      const sel = editor.getSelected();
      const st = sel ? editor.getItemState(sel.id) : undefined;
      optName.classList.toggle('none', !sel);
      optName.textContent = sel ? `선택: ${sel.id}${sel.title ? ' (' + sel.title + ')' : ''}` : '항목을 선택하세요';
      optLocked.disabled = !sel;
      optResizable.disabled = !sel;
      optLocked.checked = !!(st && st.locked);
      // 크기 조절 가능 여부의 최종 판정을 보여준다 (locked 만 있으면 기본적으로 false)
      optResizable.checked = st ? st.resizable : true;
      optLockedResizable.checked = editor.isLockedResizable();
    }
    editor.on('select', syncOptions);
    editor.on('layoutChange', syncOptions); // undo/redo/불러오기 등으로 값이 바뀐 경우에도 맞춘다

    // 위치 고정(locked)과 크기 조절(resizable)은 독립 API 로 제어한다.
    // 기본 규칙과 같아지면 명시를 지워(null) JSON 에 속성이 남지 않게 한다
    optLocked.onchange = () => {
      const sel = editor.getSelected();
      if (sel) editor.setLocked(sel.id, optLocked.checked);
    };
    optResizable.onchange = () => {
      const sel = editor.getSelected();
      if (!sel) return;
      const defaultValue = !sel.locked || editor.isLockedResizable();
      editor.setResizable(sel.id, optResizable.checked === defaultValue ? null : optResizable.checked);
    };
    optLockedResizable.onchange = () => {
      editor.setLockedResizable(optLockedResizable.checked);
      syncOptions();
    };
    syncOptions();

    let seq = 0;
    const $ = (id) => document.getElementById(id);
    $('add').onclick = () => editor.addItem({ id: `n${++seq}`, w: 3, h: 2, content: `New ${seq}` });
    $('remove').onclick = () => { const s = editor.getSelected(); if (s) editor.removeItem(s.id); };
    $('undo').onclick = () => editor.undo();
    $('redo').onclick = () => editor.redo();
    $('reset').onclick = () => editor.reset();
    // 저장: 레이아웃을 localStorage 에 기록한다. viewer.html 이 같은 키로 읽어 보여준다
    editor.on('save', (layout) => {
      try {
        localStorage.setItem('drift:layout', JSON.stringify(layout));
        log.innerHTML = '저장 완료 → <a href="/uitest/viewer.html" target="_blank">uitest/viewer.html</a> 에서 확인';
      } catch (err) {
        log.textContent = `저장 실패: ${err.message}`;
      }
    });
    $('save').onclick = () => editor.save();
    $('export').onclick = () => { $('json').value = editor.toJSON(2); };
    $('import').onclick = () => editor.fromJSON($('json').value);
    // 높이 지정: #editor(.ddr-editor 컨테이너)에 height 를 주면 그 안에서 스크롤된다. 비우면 내용 높이만큼 늘어난다. ?height=400 도 가능
    const applyHeight = (v) => { $('editor').style.height = Number(v) > 0 ? v + 'px' : ''; };
    const qh = new URLSearchParams(location.search).get('height');
    if (qh) { $('height').value = qh; applyHeight(qh); }
    $('height').oninput = (e) => applyHeight(e.target.value);
    $('grid').onchange = (e) => editor.setGrid(e.target.checked);
    $('float').onchange = (e) => editor.setFloat(e.target.checked);
    // ── 외부 모델이 상태를 관리하는 환경 시뮬레이션 (ReportStudio 등) ──
    // autoAdd:false 이면 Drift 는 내부 레이아웃을 바꾸지 않고 드롭 결과(onDrop)만 전달한다.
    // 호출자는 자기 모델을 갱신한 뒤 필요하면 editor.addItem() 으로 화면에 반영한다 (콜백 안에서 동기 호출해도 안전).
    editor.setupDragIn('.pal-ext', {
      autoAdd: false,
      onDrop: ({ item, breakpoint, columns }) => {
        $('dropLog').textContent = `onDrop: ${JSON.stringify(item)} (breakpoint=${breakpoint ?? 'desktop'}, columns=${columns})`;
        if ($('extAdd').checked) editor.addItem({ ...item, id: `ext-${++seq}` });
      },
    });
    $('bp').onchange = (e) => editor.setBreakpoint(e.target.value === '' ? null : e.target.value);
  </script>
</body>

</html>
